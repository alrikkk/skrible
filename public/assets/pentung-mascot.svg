<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Warm street lamp radial light -->
    <radialGradient id="lampLight" cx="22%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FEF08A" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#292524" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood gradient for character body -->
    <linearGradient id="bodyWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="25%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Baseball bat gradient -->
    <linearGradient id="batWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Shadow under character -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: Dark night at Pos Ronda -->
  <rect width="500" height="400" fill="#12100E"/>

  <!-- Overhang roof beams -->
  <path d="M0 0 L500 0 L500 45 L0 30 Z" fill="#1C1917"/>
  <path d="M0 30 L500 45 L500 60 L0 42 Z" fill="#292524"/>
  <line x1="100" y1="5" x2="100" y2="90" stroke="#44403C" stroke-width="10"/>
  <line x1="280" y1="5" x2="280" y2="90" stroke="#44403C" stroke-width="10"/>

  <!-- Lamp Post on Left casting warm light -->
  <circle cx="110" cy="130" r="220" fill="url(#lampLight)"/>
  <line x1="110" y1="130" x2="110" y2="360" stroke="#383532" stroke-width="5"/>
  <line x1="110" y1="130" x2="150" y2="80" stroke="#383532" stroke-width="5"/>
  <circle cx="110" cy="130" r="16" fill="#FEF08A" filter="drop-shadow(0 0 12px #F59E0B)"/>

  <!-- Pos Ronda Building Structure on Far Right (X: 370-500) with NO text -->
  <rect x="370" y="80" width="130" height="280" fill="#1C1917" stroke="#383532" stroke-width="2"/>
  
  <!-- Clean decorative wooden panel (No text bleeding) -->
  <rect x="380" y="95" width="115" height="48" rx="3" fill="#181513" stroke="#78350F" stroke-width="2"/>

  <!-- Window with vertical wooden bars -->
  <rect x="385" y="160" width="105" height="90" fill="#0C0A09" stroke="#44403C" stroke-width="2"/>
  <line x1="410" y1="160" x2="410" y2="250" stroke="#78350F" stroke-width="6"/>
  <line x1="438" y1="160" x2="438" y2="250" stroke="#78350F" stroke-width="6"/>
  <line x1="465" y1="160" x2="465" y2="250" stroke="#78350F" stroke-width="6"/>

  <!-- Wooden Bench in front of building -->
  <rect x="350" y="230" width="140" height="12" rx="2" fill="#78350F"/>
  <rect x="360" y="242" width="12" height="90" fill="#451A03"/>
  <rect x="468" y="242" width="12" height="90" fill="#451A03"/>

  <!-- Ground -->
  <rect x="0" y="330" width="500" height="70" fill="#1C1917"/>
  <line x1="0" y1="330" x2="500" y2="330" stroke="#292524" stroke-width="2"/>

  <!-- Shadow under character -->
  <ellipse cx="250" cy="345" rx="75" ry="15" fill="url(#groundShadow)"/>

  <!-- PENTUNG MASCOT CHARACTER (Center) -->
  <g transform="translate(195, 40)">
    <!-- Cylinder Wood Body -->
    <rect x="30" y="35" width="75" height="185" rx="37.5" fill="url(#bodyWood)" stroke="#451A03" stroke-width="3.5"/>

    <!-- Wood Grain Curves -->
    <path d="M42 65 Q67 73 93 65" stroke="#78350F" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M38 140 Q67 148 97 140" stroke="#78350F" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Big Wide Open Eyes -->
    <circle cx="48" cy="82" r="17" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <circle cx="48" cy="82" r="8.5" fill="#000000"/>
    <circle cx="44" cy="78" r="3" fill="#FFFFFF"/>

    <circle cx="87" cy="82" r="17" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <circle cx="87" cy="82" r="8.5" fill="#000000"/>
    <circle cx="83" cy="78" r="3" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M67 88 Q73 103 67 108" stroke="#78350F" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Gentle Friendly Smile -->
    <path d="M48 122 Q67 136 87 122" stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Skinny Arms -->
    <path d="M30 135 Q10 165 2 200" stroke="#D97706" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M105 135 Q120 160 126 195" stroke="#D97706" stroke-width="6.5" stroke-linecap="round" fill="none"/>

    <!-- Skinny Legs -->
    <rect x="45" y="220" width="10" height="75" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
    <rect x="78" y="220" width="10" height="75" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>

    <!-- Bare Feet with Toes -->
    <ellipse cx="38" cy="293" rx="18" ry="7" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
    <ellipse cx="85" cy="293" rx="18" ry="7" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>

    <!-- Baseball Bat held in right hand -->
    <g transform="translate(-50, 110) rotate(24)">
      <rect x="15" y="20" width="18" height="160" rx="9" fill="url(#batWood)" stroke="#270F03" stroke-width="2.5"/>
      <rect x="20" y="175" width="8" height="20" rx="2" fill="#FEF08A"/>
      <circle cx="24" cy="198" r="6" fill="#B45309"/>
    </g>
  </g>
</svg>